<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>XMチャート</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a22; --line:#262b36; --text:#d5dae3; --muted:#8a93a3;
    --accent:#3b82f6; --up:#26a69a; --down:#ef5350; --warn:#f5b041;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;font-size:14px;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  select,button,input{font:inherit;color:var(--text);background:#1f2430;border:1px solid var(--line);border-radius:6px}
  button{padding:6px 10px;cursor:pointer;white-space:nowrap}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* 上部の共通メニュー */
  header{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
  .seg{display:flex}
  .seg button{border-radius:0;padding:6px 11px;margin-left:-1px}
  .seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
  .seg button:last-child{border-radius:0 6px 6px 0}
  .seg .lbl{color:var(--muted);font-size:12px;margin-right:6px;align-self:center}
  #status{flex:1;display:flex;align-items:center;gap:6px;min-width:0;color:var(--muted);font-size:12px;overflow:hidden;white-space:nowrap}
  #statusText{overflow:hidden;text-overflow:ellipsis}
  #dot{width:8px;height:8px;border-radius:50%;background:#555;flex:none}
  @media (max-width:640px){
    #status{order:10;flex-basis:100%} .seg .lbl{display:none}
    header{gap:4px;padding:5px 6px} header button{padding:5px 8px;font-size:13px} .seg button{padding:5px 10px}
    #link .txt{display:none}
  }

  /* チャートの並べ方 */
  main{position:relative;flex:1;min-height:0}
  #grid{position:absolute;inset:0;display:grid;gap:2px;background:var(--line)}
  #grid.n1{grid-template-columns:1fr;grid-template-rows:1fr}
  #grid.n2{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
  #grid.n3{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr}
  #grid.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  @media (max-width:900px){
    #grid.n2{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
    #grid.n3{grid-template-columns:1fr;grid-template-rows:1fr 1fr 1fr}
  }
  #grid.max{grid-template-columns:1fr!important;grid-template-rows:1fr!important}
  #grid.max .panel:not(.isMax){display:none}

  .panel{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);container-type:inline-size}
  .ptfsel{display:none;padding:4px 4px;font-size:13px}
  .phead{display:flex;align-items:center;gap:4px;padding:4px;border-bottom:1px solid var(--line);background:var(--panel)}
  .psym{padding:4px 6px;font-weight:600;font-size:13px;max-width:42%}
  .ptfs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
  .ptfs::-webkit-scrollbar{display:none}
  .ptfs button{padding:3px 7px;font-size:12px}
  .pmax{padding:3px 8px;font-size:13px}
  #grid.n1 .pmax{display:none}
  .pbody{position:relative;flex:1;min-height:0}
  .pchart{position:absolute;inset:0}

  .legend{position:absolute;left:6px;top:4px;z-index:3;pointer-events:none;font-size:12px;line-height:1.5;max-width:calc(100% - 80px);
    text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
  #grid:not(.n1):not(.max) .legend{font-size:11px}
  .legend .sym{font-weight:700}
  .legend .up{color:var(--up)} .legend .down{color:var(--down)}
  .legend .ind span{margin-right:8px}
  .legend .quote{color:#c9ced6} .legend .quote b{color:#f5b041;font-weight:600}
  .msg,#gmsg{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);z-index:4;max-width:90%;
    background:rgba(22,26,34,.95);border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-align:center;line-height:1.6;font-size:13px}
  #gmsg{z-index:6}
  .hidden{display:none!important}
  /* 画面の幅が狭いとき（スマホで2×2など）は表示を簡略化 */
  @container (max-width:430px){
    .ptfs{display:none} .ptfsel{display:block} .phead{gap:3px} .psym{max-width:none;flex:1;min-width:0}
    .legend{font-size:11px!important;max-width:calc(100% - 64px)}
    .legend .ohlc,.legend .ind,.legend .qba{display:none}
  }

  /* 設定画面 */
  .modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--panel);width:100%;max-width:520px;max-height:80vh;overflow:auto;border-radius:14px 14px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  @media (min-width:700px){ .modal{align-items:center} .sheet{border-radius:12px} }
  .sheet h2{margin:0 0 12px;font-size:16px}
  .ind-item{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
  .ind-item label.head{display:flex;align-items:center;gap:8px;font-weight:600}
  .ind-item input[type=checkbox]{width:18px;height:18px}
  .params{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .params label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
  .params input,.params select{width:80px;padding:4px 6px}
  .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
  #cfgUrl{width:100%;padding:8px}
  /* GK_ZONE */
  .gktoast{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:5;max-width:92%;
    background:rgba(245,176,65,.95);color:#111;font-weight:600;font-size:13px;border-radius:8px;padding:7px 12px;
    box-shadow:0 2px 10px rgba(0,0,0,.5);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gkset{margin-top:8px} .gkset summary{cursor:pointer;color:var(--accent);font-size:13px;padding:4px 0}
  .gkset fieldset{border:1px solid var(--line);border-radius:8px;margin:8px 0 0;padding:6px 8px 8px}
  .gkset legend{font-size:12px;color:var(--muted);padding:0 4px}
  .gkrow{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px}
  .chip{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text)}
  .chip input[type=checkbox]{width:16px;height:16px}
  .chip input[type=number]{width:64px;padding:3px 5px} .chip select{padding:3px 5px}
  .gksess{width:100px;padding:3px 5px}
  .gklane{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px}
  .gklane h3{margin:0 0 4px;font-size:14px;display:flex;align-items:baseline;gap:8px}
  .gklane h3 small{color:var(--muted);font-weight:400;font-size:11px}
  .gklane h3 em{font-style:normal;margin-left:auto}
  .gklane table{width:100%;border-collapse:collapse;font-size:13px}
  .gklane th{width:6.5em;text-align:left;color:var(--muted);font-weight:400;padding:3px 8px 3px 0;white-space:nowrap;vertical-align:top}
  .gklane td{padding:3px 0;font-variant-numeric:tabular-nums}
  .gklane td:last-child{text-align:right;white-space:nowrap}
  .gkd{color:var(--muted);font-size:12px} .warn{color:var(--warn)} .gklane .contact{color:var(--warn)}
  .note{color:var(--muted);font-size:12px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="seg" id="layout"><span class="lbl">画面</span></div>
  <button id="link" title="オンにすると全画面の銘柄がそろって切り替わります">🔗<span class="txt"> 連動</span></button>
  <button id="tz" title="時刻表示の切り替え">日本時間</button>
  <button id="indBtn">指標</button>
  <button id="gkBtn" title="GK_ZONEの表示オン・オフ">GK</button>
  <button id="cfgBtn" aria-label="設定">⚙</button>
  <div id="status"><span id="dot"></span><span id="statusText">接続中…</span></div>
</header>
<main>
  <div id="grid" class="n1"></div>
  <div id="gmsg" class="hidden"></div>
</main>

<div id="indModal" class="modal hidden">
  <div class="sheet">
    <h2>インジケーター（全画面共通）</h2>
    <div id="indList"></div>
    <div class="row"><button id="indClose">閉じる</button></div>
  </div>
</div>

<div id="gkModal" class="modal hidden">
  <div class="sheet">
    <h2 id="gkTitle">GK_ZONE 詳細</h2>
    <div id="gkDetail"></div>
    <div class="row"><button id="gkClose">閉じる</button></div>
  </div>
</div>

<div id="cfgModal" class="modal hidden">
  <div class="sheet">
    <h2>接続設定</h2>
    <p class="note">FirebaseのデータベースURLを入力してください（例：https://xxxx-default-rtdb.asia-southeast1.firebasedatabase.app）。<br>
      この端末のブラウザに保存されます。「demo」と入力するとデモデータで表示します。</p>
    <input id="cfgUrl" type="url" placeholder="https://…firebasedatabase.app" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="row">
      <button id="cfgDemo">デモで表示</button>
      <button id="cfgCancel">閉じる</button>
      <button id="cfgSave" class="on">保存して接続</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lightweight-charts@5.3.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
'use strict';

/* =====================================================================
 *  基本設定
 * ===================================================================== */
// FirebaseのデータベースURLをここに書いておくと、どの端末でも入力不要で開けます。
// 空のままなら、画面の⚙から端末ごとに入力します。
const DEFAULT_DB_URL = 'https://xm-chart-default-rtdb.asia-southeast1.firebasedatabase.app';

const MAX_BARS   = 1000;   // 読み込む本数（EAの保存本数以下）
const TIMEFRAMES = ['M1','M5','M15','M30','H1','H4','D1'];
const TF_SEC     = {M1:60,M5:300,M15:900,M30:1800,H1:3600,H4:14400,D1:86400};
const JST        = 9 * 3600;

/* =====================================================================
 *  計算用の関数（Pine Script の ta.* に相当）
 *  src は数値の配列、戻り値は同じ長さの配列（計算できない所は null）
 * ===================================================================== */
const TA = {
  sma(src, n){
    const out = new Array(src.length).fill(null); let sum = 0, cnt = 0;
    for (let i = 0; i < src.length; i++){
      if (src[i] == null){ sum = 0; cnt = 0; continue; }
      sum += src[i]; cnt++;
      if (cnt > n){ sum -= src[i-n]; cnt = n; }
      if (cnt === n) out[i] = sum / n;
    }
    return out;
  },
  // Pineの ta.ema と同じ（最初の値はSMA）
  ema(src, n){ return TA._smooth(src, n, 2/(n+1)); },
  // Pineの ta.rma（RSIなどで使うワイルダー平滑）
  rma(src, n){ return TA._smooth(src, n, 1/n); },
  _smooth(src, n, alpha){
    const out = new Array(src.length).fill(null); let prev = null, buf = [];
    for (let i = 0; i < src.length; i++){
      const v = src[i]; if (v == null) continue;
      if (prev === null){
        buf.push(v);
        if (buf.length === n){ prev = buf.reduce((a,b)=>a+b,0)/n; out[i] = prev; }
      } else { prev = alpha*v + (1-alpha)*prev; out[i] = prev; }
    }
    return out;
  },
  // Pineの ta.stdev と同じ（母標準偏差）
  stdev(src, n){
    const mean = TA.sma(src, n), out = new Array(src.length).fill(null);
    for (let i = n-1; i < src.length; i++){
      if (mean[i] == null) continue; let s = 0;
      for (let j = i-n+1; j <= i; j++) s += (src[j]-mean[i])**2;
      out[i] = Math.sqrt(s/n);
    }
    return out;
  },
  change(src){ return src.map((v,i)=> i===0||v==null||src[i-1]==null ? null : v - src[i-1]); },
  rsi(src, n){
    const ch = TA.change(src);
    const up = TA.rma(ch.map(v=> v==null?null:Math.max(v,0)), n);
    const dn = TA.rma(ch.map(v=> v==null?null:-Math.min(v,0)), n);
    return up.map((u,i)=> u==null||dn[i]==null ? null : dn[i]===0 ? 100 : u===0 ? 0 : 100 - 100/(1+u/dn[i]));
  },
  highest(src, n){ return src.map((_,i)=> i<n-1 ? null : Math.max(...src.slice(i-n+1,i+1))); },
  lowest (src, n){ return src.map((_,i)=> i<n-1 ? null : Math.min(...src.slice(i-n+1,i+1))); },
  crossover (a, b, i){ return i>0 && a[i]!=null && b[i]!=null && a[i-1]!=null && b[i-1]!=null && a[i] > b[i] && a[i-1] <= b[i-1]; },
  crossunder(a, b, i){ return i>0 && a[i]!=null && b[i]!=null && a[i-1]!=null && b[i-1]!=null && a[i] < b[i] && a[i-1] >= b[i-1]; },
};

/* =====================================================================
 *  インジケーター定義
 *  ---------------------------------------------------------------------
 *  bars は古い順の配列：{ t, o, h, l, c, v }（Pineの time/open/high/low/close/volume）
 *  compute(bars, p, TA) が返すもの：
 *    lines   : [{ key, name, color, values:[…], width?:1-4, style?:0-4, precision? }]  … Pineの plot()
 *    markers : [{ index, position:'aboveBar'|'belowBar', shape:'arrowUp'|'arrowDown'|'circle'|'square', color, text }] … plotshape()
 *  pane    : 'main' = ローソク足に重ねる / 'sub' = 下段に表示
 *  levels  : 下段に引く水平線（例：RSIの30/70）… hline()
 *  repaint : 過去の値も変わる指標（ジグザグ等）は true にすると毎回全体を描き直します
 *
 *  ★ 自作インジケーター（Pine Script）を移植したら、この配列に追加します。
 * ===================================================================== */
const INDICATORS = [
  // GK_ZONE（MT5版を移植。レンジ・フィルターは廃止。詳細設定は「指標」画面から。計算・描画は GKPanel が担当）
  { id:'gk', name:'GK_ZONE（3時間足 ダウ / ZONE）', pane:'main', defaultOn:true, custom:'gk', params:[] },
  {
    id:'ma', name:'移動平均線', pane:'main', defaultOn:true,
    params:[
      {key:'type', label:'種類', value:'SMA', options:['SMA','EMA']},
      {key:'p1',   label:'短期', value:20},
      {key:'p2',   label:'中期', value:75},
      {key:'p3',   label:'長期', value:200},
    ],
    compute(bars, p, TA){
      const c = bars.map(b=>b.c), f = p.type === 'EMA' ? TA.ema : TA.sma;
      return { lines:[
        {key:'1', name:`${p.type}${p.p1}`, color:'#f5b041', values:f(c, +p.p1)},
        {key:'2', name:`${p.type}${p.p2}`, color:'#5dade2', values:f(c, +p.p2)},
        {key:'3', name:`${p.type}${p.p3}`, color:'#bb8fce', values:f(c, +p.p3)},
      ]};
    }
  },
  {
    id:'bb', name:'ボリンジャーバンド', pane:'main', defaultOn:false,
    params:[ {key:'n', label:'期間', value:20}, {key:'k', label:'σ', value:2} ],
    compute(bars, p, TA){
      const c = bars.map(b=>b.c), mid = TA.sma(c, +p.n), sd = TA.stdev(c, +p.n);
      return { lines:[
        {key:'m', name:`BB${p.n}`, color:'#7f8c8d', values:mid, width:1},
        {key:'u', name:`+${p.k}σ`, color:'#48c9b0', values:mid.map((m,i)=>m==null?null:m + p.k*sd[i]), width:1},
        {key:'d', name:`-${p.k}σ`, color:'#48c9b0', values:mid.map((m,i)=>m==null?null:m - p.k*sd[i]), width:1},
      ]};
    }
  },
  {
    id:'rsi', name:'RSI', pane:'sub', defaultOn:false, levels:[30,70],
    params:[ {key:'n', label:'期間', value:14} ],
    compute(bars, p, TA){
      return { lines:[ {key:'r', name:`RSI${p.n}`, color:'#af7ac5', values:TA.rsi(bars.map(b=>b.c), +p.n), precision:2} ]};
    }
  },

  // ↓↓↓ ここに自作インジケーターを追加 ↓↓↓
  // {
  //   id:'my1', name:'自作インジケーター', pane:'main', defaultOn:true,
  //   params:[ {key:'len', label:'期間', value:14} ],
  //   compute(bars, p, TA){
  //     const close = bars.map(b=>b.c);
  //     const line  = TA.ema(close, +p.len);
  //     const markers = [];
  //     for (let i = 1; i < bars.length; i++){
  //       if (TA.crossover(close, line, i))  markers.push({index:i, position:'belowBar', shape:'arrowUp',   color:'#26a69a', text:'買'});
  //       if (TA.crossunder(close, line, i)) markers.push({index:i, position:'aboveBar', shape:'arrowDown', color:'#ef5350', text:'売'});
  //     }
  //     return { lines:[{key:'l', name:'EMA', color:'#fff', values:line}], markers };
  //   }
  // },
];


/* =====================================================================
 *  GK_ZONE（MT5版 GK_ZONE.mq5 1.00 の移植）
 *  ---------------------------------------------------------------------
 *  ・3系統（初期値：現在足 / H1 / H4）のダウ判定・ZONE・フィボナッチ
 *  ・判定部（PivotRange / Trend / Zones）はMQL5コードを機械的に変換したもの
 *  ・Web版で廃止：レンジ判定、アラート条件のフィルター（ゾーンアラートフィルター・順張り・逆張り・反対ZONE・時間帯）
 *  ・Web版で追加：ZONE状態「接触中」（その時間足の現在のローソク足がZONEに一部でもかかっている）
 *  ・固定値：lookback=77、swingSpan=3、zoneback=50、保持本数=82（元コードどおり）
 *  ・上位足の位置は「時刻」で対応づけ。チャートに無い古い区間は上位足自体で代用
 * ===================================================================== */
const GK_KEEP = 82;
const NVAL = null, IVAL = -2147483648;
function IsNA(x){ return x === null || x === undefined || (typeof x === 'number' && (x === IVAL || !isFinite(x))); }
function PEq(a,b){ return !IsNA(a) && !IsNA(b) && a == b; }
function PNe(a,b){ return !IsNA(a) && !IsNA(b) && a != b; }
function PLt(a,b){ return !IsNA(a) && !IsNA(b) && a <  b; }
function PGt(a,b){ return !IsNA(a) && !IsNA(b) && a >  b; }
function PLe(a,b){ return !IsNA(a) && !IsNA(b) && a <= b; }
function PGe(a,b){ return !IsNA(a) && !IsNA(b) && a >= b; }
function PAdd(a,b){ return IsNA(a)||IsNA(b) ? NVAL : a+b; }
function PSub(a,b){ return IsNA(a)||IsNA(b) ? NVAL : a-b; }
function PMul(a,b){ return IsNA(a)||IsNA(b) ? NVAL : a*b; }
function I(x){ return IsNA(x) ? IVAL : Math.trunc(x); }

const GK_TFS = ['CUR','M1','M5','M15','M30','H1','H4','D1'];
const GK_COLORS = {
  up:'#00ffff', down:'#ff0000', zoneUp:'#00bcd4', zoneDown:'#ff0000',
  text:'#ffffff', fibo:'#ffffff', panelUp:'#00ffff', panelDown:'#ff0000', panelNone:'#808080',
  wmUp:'#00bcd4', wmDown:'#ff0000', wmNeutral:'#ffffff',
};
function gkLaneDefaults(tf){
  return {tf, enabled:true, pullback:true, extremes:true, zones:true, horizontal:false, hbars:50,
          zoneAlert:true, lineAlert:false, labels:true, fibo:false};
}
const GK_DEFAULTS = {
  lanes:[gkLaneDefaults('CUR'), gkLaneDefaults('H1'), gkLaneDefaults('H4')],
  panel:true, watermark:true, toast:true,
};
let GKS = null;   // 設定（端末ごとに保存）
function gkSettings(){
  if (GKS) return GKS;
  const saved = store.get('gk', {}) || {};
  GKS = Object.assign({}, GK_DEFAULTS, saved);
  GKS.lanes = GK_DEFAULTS.lanes.map((d,i)=>Object.assign({}, d, (saved.lanes || [])[i] || {}));
  return GKS;
}
function gkSave(){ store.set('gk', GKS); }
function gkTFText(min){
  if (min === 1440) return '1D'; if (min === 10080) return '1W';
  if (min >= 60 && min % 60 === 0) return (min/60) + 'H';
  return min + 'm';
}
// 透過（MT5のBlend）を rgba に
function gkAlpha(hex, transparency){
  const n = parseInt(hex.slice(1), 16), a = (100 - transparency) / 100;
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function gkResetState(){
  return {
    pendingIdx:IVAL, pendingPrice:NVAL, pendingType:IVAL, trendDirection:0,
    takane:NVAL, takaneindex:IVAL, yasune:NVAL, yasuneindex:IVAL,

// チャート足の位置（現在足=0）を持つ項目。足が進んだら時刻基準でずらす
const GK_SHIFT_FIELDS = ['takaneindex','minlowindex','yasuneindex','maxhighindex','zzIndex',
  'alerttakaneindex','alertyasuneindex','fiboosiindex','fibomodosiindex','alertlowindex','alerthighindex'];

class GKEngine {
  constructor(lane){
    this.lane = lane; this.lookback = 77; this.swingSpan = 3; this.zoneback = 50;

    this.ready = false; this.dataError = false; this.status = '履歴待機'; this.contact = false; this.candle = null;
    this.htf = []; this.hArr = []; this.lArr = []; this.cArr = []; this.oArr = [];
    this.ZigZagType = []; this.ZigZagIndex = []; this.ZoneTop = []; this.ZoneBottom = []; this.ZoneIndex = []; this.ZoneColor = [];

  GethArr(i){ return this.SafeGet(this.hArr, i); }
  GetlArr(i){ return this.SafeGet(this.lArr, i); }

  CountZigZagIndex(){ return this.ZigZagIndex.length; }
  CountZoneIndex(){ return this.ZoneIndex.length; }
  GetZoneIndex(i){ const v = this.SafeGet(this.ZoneIndex, i); return v === NVAL ? IVAL : v; }
  GetZoneTop(i){ return this.SafeGet(this.ZoneTop, i); }
  GetZoneBottom(i){ return this.SafeGet(this.ZoneBottom, i); }
  GetZoneColor(i){ return this.SafeGet(this.ZoneColor, i); }
  PushZigZagType(v){ this.ZigZagType.push(v); }
  PushZigZagIndex(v){ this.ZigZagIndex.push(v); }
  PushZoneIndex(v){ this.ZoneIndex.push(v); }

  /* ---- チャート足（現在足=0）。チャートに無い古い区間は上位足で補う ---- */
  bar(i){
    if (IsNA(i) || i < 0) return null;
    const n = this.chart.length;
    if (i < n) return this.chart[n - 1 - i];
    return this.older[i - n] || null;
  }
  CH(i){ const b = this.bar(i); return b ? b.h : NVAL; }
  CL(i){ const b = this.bar(i); return b ? b.l : NVAL; }
  barCount(){ return this.chart.length + this.older.length; }
  // チャート上の横位置（論理インデックス）
  logical(i){
    const n = this.chart.length;
    if (IsNA(i) || i < 0) return null;
    if (i < n) return n - 1 - i;
    const b = this.older[i - n]; if (!b) return null;
    return -(this.chart[0].t - b.t) / this.chartSec;
  }
  // 時刻 → 位置（現在足=0）
  shiftOfTime(t){
    const bars = this.chart; let lo = 0, hi = bars.length - 1;
    if (!bars.length || t > bars[hi].t) return null;
    if (t >= bars[0].t){
      while (lo < hi){ const mid = (lo + hi + 1) >> 1; if (bars[mid].t <= t) lo = mid; else hi = mid - 1; }
      return bars.length - 1 - lo;
    }
    for (let k = 0; k < this.older.length; k++) if (this.older[k].t <= t) return bars.length + k;
    return null;
  }

  /* ---- 上位足の読み込み（MT5版 LoadHTF に相当） ---- */
  loadHTF(ctx){
    const cfg = this.cfg;
    if (!cfg.enabled){ this.status = 'OFF'; return false; }
    if (cfg.minutes * 60 < ctx.chartSec){ this.status = '設定足がチャート足未満'; return false; }
    const src = cfg.minutes * 60 === ctx.chartSec ? ctx.chart : ctx.htf[cfg.tf];
    if (!src || src.length < GK_KEEP + 1){ this.status = '上位足の履歴待機（82本）'; return false; }
    const closed = src.slice(src.length - GK_KEEP - 1, src.length - 1);
    this.htf = closed.slice().reverse();       // [0]=最新の確定足
    this.htfFormingT = src[src.length - 1].t;
    this.hArr = this.htf.map(b=>b.h); this.lArr = this.htf.map(b=>b.l);
    this.cArr = this.htf.map(b=>b.c); this.oArr = this.htf.map(b=>b.o);
    this.chart = ctx.chart; this.chartSec = ctx.chartSec;
    const first = ctx.chart[0].t;
    this.older = src === ctx.chart ? [] : src.filter(b=>b.t < first).reverse();
    return true;
  }

  // 上位足 idx の区間内で、その高値/安値と一致するチャート足の位置
  MapShift(idx, price, isHigh){
    if (IsNA(idx) || idx < 0 || idx >= this.htf.length){ this.dataError = true; return IVAL; }
    const from = this.htf[idx].t, until = idx > 0 ? this.htf[idx-1].t : this.htfFormingT;
    const n = this.barCount();
    for (let i = 0; i < n; i++){
      const b = this.bar(i);
      if (b.t < from || b.t >= until) continue;
      if (PEq(price, isHigh ? b.h : b.l)) return i;
    }
    this.dataError = true; return IVAL;
  }

  // 前回の確定時から足が進んだ分、位置をずらす（時刻基準を保つ）
  reanchor(now){
    const st = this.st;
    if (st.anchor === null || st.anchor === now) { st.anchor = now; return; }
    const d = this.shiftOfTime(st.anchor);
    if (d === null) return;
    for (const k of GK_SHIFT_FIELDS) if (!IsNA(st[k])) st[k] += d;
    st.anchor = now;
  }

  Rebuild(now){

    st.pendingIdx=IVAL; st.pendingPrice=NVAL; st.pendingType=IVAL; st.trendDirection=0;
    st.takane=NVAL; st.takaneindex=IVAL; st.yasune=NVAL; st.yasuneindex=IVAL;
    st.maxhigh=NVAL; st.maxhighindex=IVAL; st.minlow=NVAL; st.minlowindex=IVAL;
    this.ZigZagType=[]; this.ZigZagIndex=[]; this.ZoneIndex=[]; this.ZoneTop=[]; this.ZoneBottom=[]; this.ZoneColor=[];

      if (st.trendDirection === 1){
        st.takaneindex = this.MapShift(st.takaneindex, st.takane, true);
        st.minlowindex = this.MapShift(st.minlowindex, st.minlow, false);
      } else if (st.trendDirection === -1){
        st.yasuneindex = this.MapShift(st.yasuneindex, st.yasune, false);
        st.maxhighindex = this.MapShift(st.maxhighindex, st.maxhigh, true);
      }

    }

  }

  Realtime(){
    const st = this.st, CH = i=>this.CH(i), CL = i=>this.CL(i);

    if (st.trendDirection === 1){

        for (let k = 0; k <= st.minlowindex; k++) if (PLt(st.takane, CH(k))){ st.takane = CH(k); st.takaneindex = k; }
      }
      st.alerttakane = CH(0); st.alerttakaneindex = 0;
      st.fiboosi = CL(st.zzIndex); st.fiboosiindex = st.zzIndex;

        for (let f = st.alerttakaneindex; f <= st.zzIndex; f++) if (PGt(st.fiboosi, CL(f))){ st.fiboosi = CL(f); st.fiboosiindex = f; }
        st.fibo382 = PSub(st.alerttakane, PMul(PSub(st.alerttakane, st.fiboosi), 0.382));
        st.zoneharf = PAdd(st.Zonebottom, PMul(PSub(st.Zonetop, st.Zonebottom), 0.5));
      }
    } else if (st.trendDirection === -1){
      if (st.yasuneflag){
        st.yasune = CL(0); st.yasuneindex = 0;
        for (let k = 0; k <= st.maxhighindex; k++) if (PGt(st.yasune, CL(k))){ st.yasune = CL(k); st.yasuneindex = k; }
      }
      st.alertyasune = CL(0); st.alertyasuneindex = 0;
      st.fibomodosi = CH(st.zzIndex); st.fibomodosiindex = st.zzIndex;
      if (st.Zonecount > 0){
        for (let f = 0; f <= st.zzIndex; f++) if (PGt(st.alertyasune, CL(f))){ st.alertyasune = CL(f); st.alertyasuneindex = f; }
        for (let f = st.alertyasuneindex; f <= st.zzIndex; f++) if (PLt(st.fibomodosi, CH(f))){ st.fibomodosi = CH(f); st.fibomodosiindex = f; }
        st.fibo382 = PAdd(st.alertyasune, PMul(PSub(st.fibomodosi, st.alertyasune), 0.382));
        st.zoneharf = PAdd(st.Zonebottom, PMul(PSub(st.Zonetop, st.Zonebottom), 0.5));
      }
    }
  }

  /* ---- ここから MQL5 の PivotRange1 / Trend1 / Zones1 を機械変換したもの ---- */
  PivotRange() {
    this.iter = this.iter || 0;
    {

            }
          }
        }
        if(((!isHigh) && (!isLow))) {

        }
        let curPrice = (isHigh ? this.GethArr(I(idx)) : this.GetlArr(I(idx)));
        let curType = (isHigh ? 1 : (-1));
        if((IsNA(this.st.pendingType) || PEq(this.st.pendingType, 0))) {
          this.st.pendingIdx = I(idx);
          this.st.pendingPrice = curPrice;
          this.st.pendingType = I(curType);
          continue;
        }
        if(PNe(this.st.pendingType, curType)) {
          this.PushZigZagType(this.st.pendingType);
          this.PushZigZagIndex(this.st.pendingIdx);
          this.st.pendingIdx = I(idx);
          this.st.pendingPrice = curPrice;
          this.st.pendingType = I(curType);
        }
        else {
          if((PEq(curType, 1) && PGt(curPrice, this.st.pendingPrice))) {
            this.st.pendingIdx = I(idx);
            this.st.pendingPrice = curPrice;
          }
          if((PEq(curType, (-1)) && PLt(curPrice, this.st.pendingPrice))) {

            this.st.pendingPrice = curPrice;

  Trend() {

/* =====================================================================
 *  1画面分の GK_ZONE（計算・アラート・描画）
 * ===================================================================== */
class GKPanel {
  constructor(panel){
    this.p = panel; this.htf = {}; this.fetching = {}; this.model = null; this.seq = 0;
    this.toastEl = document.createElement('div'); this.toastEl.className = 'gktoast hidden';
    panel.el.querySelector('.pbody').appendChild(this.toastEl);
    const self = this;
    this.primitive = {
      attached(p){ self.lc = p.chart; self.series = p.series; self.requestUpdate = p.requestUpdate; },
      detached(){ self.requestUpdate = null; },
      updateAllViews(){},
      paneViews(){ return [{ zOrder(){ return 'normal'; }, renderer(){ return self.renderer; } }]; },
    };
    this.renderer = { draw:t=>this.draw(t, false), drawBackground:t=>this.draw(t, true) };
    panel.candle.attachPrimitive(this.primitive);
    this.reset();
  }
  on(){ return !!(indState.gk && indState.gk.on); }

  // 設定・銘柄・時間足が変わったとき：最初から計算し直す
  reset(){
    this.seq++;
    this.engines = [0,1,2].map(i=>new GKEngine(i));
    this.started = false; this.currentBar = null; this.lastAlertBar = null;
    this.quiet = true;   // 読み込み直後の1回目はアラートを画面に出さない
    this.htf = {}; this.fetching = {};
    this.refresh();
    this.loadHtf();
  }
  neededTfs(){
    const s = gkSettings(), chartSec = TF_SEC[this.p.tf], out = new Set();
    if (!this.on()) return [];
    for (const ln of s.lanes) if (ln.enabled && ln.tf !== 'CUR' && TF_SEC[ln.tf] > chartSec) out.add(ln.tf);
    return [...out];
  }
  async loadHtf(tfs){
    const sym = this.p.sym; if (!sym || !G.src) return;
    const seq = this.seq;
    for (const tf of (tfs || this.neededTfs())){
      if (this.fetching[tf]) continue;
      this.fetching[tf] = true;
      try{
        const bars = await G.src.history(sym.key, tf, GK_KEEP + 8);
        if (seq !== this.seq) return;
        this.htf[tf] = bars;
      }catch(e){}
      finally{ if (seq === this.seq) this.fetching[tf] = false; }
    }
    if (seq === this.seq) this.p.schedule(false);
  }
  // チャートに新しい足ができたとき：区切りを越えた上位足を取り直す
  onNewBar(t){
    const due = [];
    for (const tf of Object.keys(this.htf)){
      const b = this.htf[tf]; if (!b || !b.length) continue;
      if (t >= b[b.length-1].t + TF_SEC[tf]) due.push(tf);
    }
    if (due.length) this.loadHtf(due);
  }

  laneCfg(i){
    const ln = gkSettings().lanes[i], chartSec = TF_SEC[this.p.tf];
    const tf = ln.tf === 'CUR' ? this.p.tf : ln.tf;
    return {
      tf, minutes:(ln.tf === 'CUR' ? chartSec : TF_SEC[ln.tf]) / 60,
      enabled:ln.enabled, showPullback:ln.pullback, showExtremes:ln.extremes, showZone:ln.zones,
      horizontal:ln.horizontal, horizontalBars:+ln.hbars || 50,
      zoneAlert:ln.zoneAlert, lineAlert:ln.lineAlert, labels:ln.labels, fibo:ln.fibo,
      up:GK_COLORS.up, down:GK_COLORS.down, zoneUp:GK_COLORS.zoneUp, zoneDown:GK_COLORS.zoneDown,
      textColor:GK_COLORS.text, fiboColor:GK_COLORS.fibo, width:2, fiboWidth:1,
    };
  }

  /* ---- 再計算（MT5版 Refresh に相当） ---- */
  refresh(){
    const bars = this.p.bars;
    if (!this.on() || !this.p.sym || bars.length < 2){ this.model = null; this.update(); return; }
    const now = bars[bars.length-1].t, chartSec = TF_SEC[this.p.tf];
    if (this.started && this.currentBar !== now) this.engines.forEach(e=>e.commit());
    this.currentBar = now; this.started = true;
    const ctx = {chart:bars, chartSec, htf:this.htf};
    for (const e of this.engines){
      e.cfg = this.laneCfg(e.lane);
      e.restore(); e.ready = false;
      if (!e.loadHTF(ctx)) continue;
      e.reanchor(now);
      if (e.st.First || e.st.last_closed !== e.htf[0].t) e.Rebuild(now);
      if (!e.dataError){ e.Realtime(); e.ready = true; e.status = 'OK'; }
      else e.status = '価格・時刻の対応を確認できません';
    }
    for (let i = 0; i < 3; i++){ this.processAlerts(i); this.updateContact(this.engines[i]); }
    // 上位足がすべて揃って1回計算するまでは、読み込み時点の状態でアラートを出さない
    if (!this.engines.some(e=>e.status.startsWith('上位足'))) this.quiet = false;
    this.model = this.buildModel();
    this.update();
    if (gkDetailPanel === this.p) gkRenderDetail();
  }
  hit(pt){ const r = this.panelRect; return !!(r && pt.x >= r.x1 && pt.x <= r.x2 && pt.y >= r.y1 && pt.y <= r.y2); }

  /* ---- 詳細（右下の表をタップしたとき） ---- */
  detailHTML(){
    const d = this.p.digits, last = this.p.bars[this.p.bars.length-1];
    if (!last) return '<p class="note">データがありません</p>';
    const price = last.c, f = v => IsNA(v) ? '-' : (+v).toFixed(d);
    const pipMul = d === 3 || d === 5 ? Math.pow(10, d-1) : Math.pow(10, d), unit = d === 3 || d === 5 ? 'pips' : 'pt';
    const dist = v => {
      if (IsNA(v)) return '';
      const x = (v - price) * pipMul, a = Math.abs(x);
      return `<span class="gkd">${x >= 0 ? '+' : '−'}${unit === 'pips' ? a.toFixed(1) : Math.round(a)} ${unit}</span>`;
    };
    const row = (k, v, extra='') => `<tr><th>${k}</th><td>${v}</td><td>${extra}</td></tr>`;
    const names = ['第1系統','第2系統','第3系統'];
    let html = `<p class="note">現在値（Bid） <b>${f(price)}</b>　距離は現在値からの差（上が＋）</p>`;
    this.engines.forEach((e, i)=>{
      const v = e.st, c = e.cfg, dir = v.trendDirection, tf = gkTFText(c.minutes || TF_SEC[this.p.tf]/60);
      const up = dir === 1, down = dir === -1;
      const trend = up ? '上昇' : down ? '下降' : 'NONE';
      const col = up ? GK_COLORS.panelUp : down ? GK_COLORS.panelDown : GK_COLORS.panelNone;
      html += `<section class="gklane"><h3><span>${tf}</span><small>${names[i]}</small>`;
      if (!e.ready){ html += `<em style="color:${GK_COLORS.panelNone}">${esc(e.status)}</em></h3></section>`; return; }
      html += `<em style="color:${col}">ダウ: ${trend}</em></h3><table>`;
      if (up || down){
        html += row(up ? '高値' : '安値', f(up ? v.takane : v.yasune), dist(up ? v.takane : v.yasune));
        html += row(up ? '押し安値' : '戻り高値', f(up ? v.minlow : v.maxhigh), dist(up ? v.minlow : v.maxhigh) +
          ((up ? PLt(price, v.minlow) : PGt(price, v.maxhigh)) ? ' <b class="warn">割れ</b>' : ''));
        if (v.Zonecount > 0){
          const mark = up ? '↑↑↑' : '↓↓↓', alerted = up ? v.alertedL : v.alertedS, cd = e.candle;
          const lines = [];
          if (e.contact) lines.push(`<b class="contact">接触中</b>（現在の${tf}足がZONEにかかっている）`);
          lines.push(alerted ? `<b>${mark}</b> ZONE到達済み（直近${up ? '高値' : '安値'}のあとZONEまで戻った）`
                             : `未到達（直近${up ? '高値' : '安値'}のあと、まだZONEまで戻っていない）`);
          html += row('ZONE上限', f(v.Zonetop), dist(v.Zonetop));
          html += row('ZONE下限', f(v.Zonebottom), dist(v.Zonebottom));
          html += row('ZONE状態', lines.join('<br>'), `候補 ${v.Zonecount}件`);
          if (cd) html += row(`現在の${tf}足`, `高 ${f(cd.h)}<br>安 ${f(cd.l)}`, '');
          html += row(up ? '直近高値' : '直近安値', f(up ? v.alerttakane : v.alertyasune), dist(up ? v.alerttakane : v.alertyasune));
          const hi = up ? v.alerttakane : v.fibomodosi, lo = up ? v.fiboosi : v.alertyasune;
          if (!IsNA(hi) && !IsNA(lo)){
            const lv = [0.382, 0.5, 0.618].map(r=>{ const pr = up ? hi - (hi - lo) * r : lo + (hi - lo) * r; return `${(r*100).toFixed(1)}% ${f(pr)}`; });
            html += row('フィボ', lv.join('<br>'), '');
          }
        } else html += row('ZONE', 'なし', '');
      } else html += row('状態', '転換点が足りず判定できません', '');
      html += '</table></section>';
    });
    return html;
  }

  // 接触中：その時間足の現在のローソク足が、ZONEに一部でもかかっている
  updateContact(e){
    e.contact = false; e.candle = null;
    if (!e.ready) return;
    const bars = this.p.bars, sec = e.cfg.minutes * 60, start = Math.floor(this.currentBar / sec) * sec;
    let h = -Infinity, l = Infinity;
    for (let k = bars.length - 1; k >= 0 && bars[k].t >= start; k--){ h = Math.max(h, bars[k].h); l = Math.min(l, bars[k].l); }
    if (!isFinite(h)) return;
    e.candle = {h, l, t:start};
    const v = e.st;
    if ((v.trendDirection === 1 || v.trendDirection === -1) && v.Zonecount > 0)
      e.contact = PLe(l, v.Zonetop) && PGe(h, v.Zonebottom);
  }
  fire(msg){
    // 1本の足につき1回だけ（元コードの alert.freq_once_per_bar と同じ）
    if (this.lastAlertBar === this.currentBar) return;
    this.lastAlertBar = this.currentBar;
    if (this.quiet || !gkSettings().toast) return;
    this.toastEl.textContent = '🔔 GK_ZONE ' + this.p.sym.name + ' ' + msg;
    this.toastEl.classList.remove('hidden');
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(()=>this.toastEl.classList.add('hidden'), 8000);
  }

  processAlerts(index){
    const e = this.engines[index]; if (!e.ready) return;
    const v = e.st, c = e.cfg;
    let inL = false, inS = false, lineL = false, lineS = false;
    if (v.trendDirection === 1){
      if (v.alerttakaneindex > 0){
        v.alertlow = v.alerttakane;
        for (let n = 0; n < v.alerttakaneindex; n++) if (PGt(v.alertlow, e.CL(n))) v.alertlow = e.CL(n);
        inL = PGe(v.Zonetop, v.alertlow);
      }
      v.osilow = v.takane;
      for (let n = 0; n <= v.takaneindex; n++) if (PGt(v.osilow, e.CL(n))) v.osilow = e.CL(n);
      lineL = PGe(v.minlow, v.osilow);
    } else if (v.trendDirection === -1){
      if (v.alertyasuneindex > 0){
        v.alerthigh = v.alertyasune;
        for (let n = 0; n < v.alertyasuneindex; n++) if (PLt(v.alerthigh, e.CH(n))) v.alerthigh = e.CH(n);
        inS = PLe(v.Zonebottom, v.alerthigh);
      }
      v.modosihigh = v.yasune;
      for (let n = 0; n <= v.yasuneindex; n++) if (PLt(v.modosihigh, e.CH(n))) v.modosihigh = e.CH(n);
      lineS = PLe(v.maxhigh, v.modosihigh);
    }
    const tfText = gkTFText(c.minutes);
    if (v.trendDirection === 1){
      if (PNe(v.alerttakane, v.prevTakane)){ v.alertedL = false; v.prevTakane = v.alerttakane; }
      if (PNe(v.Zonetop, v.prevAlertTop)){ v.alertedL = false; v.prevAlertTop = v.Zonetop; }
      if (v.Zonecount === 0) v.alertedL = false;
      if (inL && !v.alertedL){
        v.alertedL = true; v.prevTakane = v.alerttakane; v.prevAlertTop = v.Zonetop;
        if (c.zoneAlert) this.fire(tfText + '上昇ZONE');
      }
      if (PNe(v.minlow, v.prevAlertminlow)){ v.alertedlineL = false; v.prevAlertminlow = v.minlow; }
      if (lineL && !v.alertedlineL && c.lineAlert){
        v.alertedlineL = true; v.prevAlertminlow = v.minlow; this.fire(tfText + '上昇押し安値');
      }
    } else if (v.trendDirection === -1){
      if (PNe(v.alertyasune, v.prevYasune)){ v.alertedS = false; v.prevYasune = v.alertyasune; }
      if (PNe(v.Zonebottom, v.prevAlertBottom)){ v.alertedS = false; v.prevAlertBottom = v.Zonebottom; }
      if (v.Zonecount === 0) v.alertedS = false;
      if (inS && !v.alertedS){
        v.alertedS = true; v.prevYasune = v.alertyasune; v.prevAlertBottom = v.Zonebottom;
        if (c.zoneAlert) this.fire(tfText + '下降ZONE');
      }
      if (PNe(v.maxhigh, v.prevAlertmaxhigh)){ v.alertedlineS = false; v.prevAlertmaxhigh = v.maxhigh; }
      if (lineS && !v.alertedlineS && c.lineAlert){
        v.alertedlineS = true; v.prevAlertmaxhigh = v.maxhigh; this.fire(tfText + '下降戻り高値');
      }
    }
  }

  /* ---- 描画内容を組み立てる（MT5版 RenderLane / RenderPanel / RenderWatermark） ---- */
  buildModel(){
    const S = gkSettings(), m = {lines:[], boxes:[], texts:[], rows:[], wm:null};
    const last = this.p.bars.length - 1;
    this.engines.forEach((e, index)=>{
      const v = e.st, c = e.cfg;
      if (!c.enabled || !e.ready) return;
      const up = v.trendDirection === 1, down = v.trendDirection === -1;
      const lineColor = up ? c.up : c.down, tfText = gkTFText(c.minutes);
      const labelLi = last + (index === 0 ? 7 : (index === 1 ? -8 : -23));
      const textColor = gkAlpha(c.textColor, 50);
      if ((up || down) && c.showExtremes)
        m.lines.push({li:e.logical(up ? v.takaneindex : v.yasuneindex), price:up ? v.takane : v.yasune, color:lineColor, width:c.width, ray:true});
      if ((up || down) && c.showPullback){
        const price = up ? v.minlow : v.maxhigh;
        m.lines.push({li:e.logical(up ? v.minlowindex : v.maxhighindex), price, color:lineColor, width:c.width, ray:true});
        if (c.labels) m.texts.push({li:labelLi, price, text:tfText + (up ? '押し' : '戻し'), color:textColor});
      }
      if ((up || down) && c.showZone && v.Zonecount > 0){
        m.boxes.push({li:e.logical(v.zzIndex), li2:null, top:v.Zonetop, bottom:v.Zonebottom, color:gkAlpha(up ? c.zoneUp : c.zoneDown, 80)});
        if (c.labels) m.texts.push({li:labelLi, price:v.Zonebottom, text:tfText, color:textColor});
      }
      if (c.fibo && (up || down) && v.Zonecount > 0){
        const fr = [0,0.382,0.5,0.618,0.786,1], lb = ['0','0.382','0.5','0.618','0.786','1'];
        const start = e.logical(up ? v.fiboosiindex : v.fibomodosiindex), fc = gkAlpha(c.fiboColor, 50);
        fr.forEach((f,k)=>{
          const price = up ? v.alerttakane - (v.alerttakane - v.fiboosi) * f : v.alertyasune + (v.fibomodosi - v.alertyasune) * f;
          m.lines.push({li:start, li2:last, price, color:fc, width:c.fiboWidth, ray:false});
          m.texts.push({li:start, price, text:lb[k], color:fc});
        });
      }
    });
    if (S.panel){
      this.engines.forEach((e, i)=>{
        const v = e.st, d = v.trendDirection, tfText = gkTFText(e.cfg.minutes || TF_SEC[this.p.tf]/60);
        const trend = d === 1 ? '上昇' : d === -1 ? '下降' : 'NONE';
        let color = d === 1 ? GK_COLORS.panelUp : d === -1 ? GK_COLORS.panelDown : GK_COLORS.panelNone;
        const mark = d === 1 && v.alertedL ? '↑↑↑' : d === -1 && v.alertedS ? '↓↓↓' : '';
        let zone = e.contact ? (mark ? mark + ' 接触中' : '接触中') : (mark || 'NONE');
        let text = `${tfText}   ダウ: ${trend}   ZONE: ${zone}`, short = `${tfText} ${trend} ${(mark ? mark[0] : '') + (e.contact ? '接触' : '') || '-'}`;
        if (!e.ready){
          text = `${tfText}   ${e.status}`; color = GK_COLORS.panelNone;
          short = `${tfText} ${e.status === 'OFF' ? 'OFF' : e.status.startsWith('設定足') ? '対象外' : '待機中'}`;
        }
        m.rows.push({text, short, color});
      });
    }
    if (S.watermark){
      let up = true, down = true;
      for (const e of this.engines){ if (!e.ready) continue; const d = e.st.trendDirection; up = up && d === 1; down = down && d === -1; }
      const col = up ? GK_COLORS.wmUp : down ? GK_COLORS.wmDown : GK_COLORS.wmNeutral;
      m.wm = gkAlpha(col, up || down ? 50 : 80);
    }
    return m;
  }

  update(){ if (this.requestUpdate) this.requestUpdate(); }

  draw(target, background){
    const m = this.model; if (!m || !this.lc){ this.panelRect = null; return; }
    target.useMediaCoordinateSpace(({context:ctx, mediaSize})=>{
      const ts = this.lc.timeScale(), W = mediaSize.width, H = mediaSize.height;
      const X = li => li == null || IsNA(li) ? null : ts.logicalToCoordinate(li);
      const Y = p => IsNA(p) ? null : this.series.priceToCoordinate(p);
      const small = W < 420, tiny = W < 300;
      if (background){
        if (m.wm){
          ctx.save(); ctx.fillStyle = m.wm; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.font = `bold ${tiny ? 18 : small ? 26 : 40}px sans-serif`; ctx.fillText('GK_ZONE', W/2, H/2); ctx.restore();
        }
        for (const b of m.boxes){
          const x1 = X(b.li), y1 = Y(b.top), y2 = Y(b.bottom); if (x1 == null || y1 == null || y2 == null) continue;
          const x2 = b.li2 == null ? W : X(b.li2); if (x2 == null) continue;
          ctx.fillStyle = b.color; ctx.fillRect(Math.min(x1,x2), Math.min(y1,y2), Math.abs(x2-x1), Math.max(1, Math.abs(y2-y1)));
        }
        return;
      }
      for (const l of m.lines){
        const x1 = X(l.li), y = Y(l.price); if (x1 == null || y == null) continue;
        const x2 = l.ray ? W : X(l.li2); if (x2 == null) continue;
        ctx.strokeStyle = l.color; ctx.lineWidth = l.width; ctx.beginPath();
        const yy = Math.round(y) + (l.width % 2 ? 0.5 : 0);
        ctx.moveTo(x1, yy); ctx.lineTo(x2, yy); ctx.stroke();
      }
      ctx.font = `${small ? 10 : 12}px sans-serif`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      for (const t of m.texts){
        const x = X(t.li), y = Y(t.price); if (x == null || y == null) continue;
        ctx.fillStyle = t.color; ctx.fillText(t.text, x, y);
      }
      if (m.rows.length){
        const fs = small ? 10 : 12, lh = fs + 6;
        ctx.font = `${fs}px sans-serif`; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
        const useShort = m.rows.some(r=>ctx.measureText(r.text).width > W - 70);
        let minX = W;
        m.rows.forEach((row, i)=>{
          const r = {text: (useShort ? row.short : row.text) + (i === 0 ? ' ⓘ' : ''), color: row.color};
          minX = Math.min(minX, W - 10 - ctx.measureText(r.text).width - 4);
          const y = H - 8 - (m.rows.length - 1 - i) * lh;
          ctx.fillStyle = 'rgba(15,17,21,.75)';
          const w = ctx.measureText(r.text).width; ctx.fillRect(W - 10 - w - 4, y - fs - 3, w + 8, fs + 6);
          ctx.fillStyle = r.color; ctx.fillText(r.text, W - 10, y);
        });
        // タップ判定用の範囲（少し広めに取る）
        this.panelRect = {x1:minX - 12, y1:H - 8 - m.rows.length * lh - 12, x2:W, y2:H};
      }
      if (!m.rows.length) this.panelRect = null;
    });
  }
}

/* ---------- データの取得元：Firebase ---------- */
const Firebase = {
  url(path, q){ return G.db.replace(/\/+$/,'') + path + '.json' + (q ? '?' + q : ''); },
  async get(path, q){
    const r = await fetch(this.url(path, q), {cache:'no-store'});
    if (r.status === 401) throw new Error('読み取りが許可されていません（データベースのルールを確認）');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  },
  async symbols(){
    const m = await this.get('/meta') || {};
    return Object.entries(m).map(([key,v])=>({key, name:v.name||key, digits:v.digits ?? 5, order:v.order ?? 99}))
      .sort((a,b)=>a.order-b.order);
  },
  async status(){ return await this.get('/status') || {}; },
  async history(key, tf, n){
    const obj = await this.get(`/bars/${key}/${tf}`, 'orderBy=' + encodeURIComponent('"$key"') + '&limitToLast=' + n) || {};
    return Object.keys(obj).map(k=>{ const a = obj[k]; return {t:+k, o:+a[0], h:+a[1], l:+a[2], c:+a[3], v:+(a[4]||0)}; })
      .filter(b=>isFinite(b.t) && isFinite(b.c)).sort((a,b)=>a.t-b.t);
  },
  subscribe(key, tf, onBar, onReconnect){ return Hub.subscribe(key, tf, onBar, onReconnect); },
  closeAll(){ Hub.closeAll(); },
};

/* ---------- リアルタイム受信（銘柄ごとに接続を1本にまとめる） ----------
 * 同じ銘柄を1つの時間足だけで見ているときは live/銘柄/時間足 を、
 * 複数の時間足で見ているときは live/銘柄 をまとめて受信します。 */
const Hub = {
  streams:{},
  subscribe(key, tf, onBar, onReconnect){
    const st = this.streams[key] || (this.streams[key] = {subs:new Set(), tree:{}, es:null, want:undefined, hadError:false});
    const sub = {tf, onBar, onReconnect}; st.subs.add(sub);
    this.sync(key);
    if (st.tree[tf]) setTimeout(()=>this.emit(sub, st.tree[tf]), 0);
    return ()=>{ st.subs.delete(sub); this.sync(key); };
  },
  emit(sub, o){
    if (!o || !o.t) return;
    sub.onBar({t:+o.t, o:+o.o, h:+o.h, l:+o.l, c:+o.c, v:+(o.v||0)}, o.a != null ? {b:+o.b, a:+o.a, sp:+o.sp} : null);
  },
  sync(key){
    const st = this.streams[key]; if (!st) return;
    const tfs = [...new Set([...st.subs].map(s=>s.tf))];
    const want = tfs.length === 0 ? null : tfs.length === 1 ? '/' + tfs[0] : '';
    if (st.want === want) return;
    if (st.es){ st.es.close(); st.es = null; }
    st.want = want;
    if (want === null){ delete this.streams[key]; return; }
    const es = new EventSource(Firebase.url(`/live/${key}${want}`)); st.es = es;
    const handle = (ev, isPatch) => {
      let msg; try{ msg = JSON.parse(ev.data); }catch(e){ return; }
      if (!msg) return;
      const segs = (want + (msg.path === '/' ? '' : msg.path)).split('/').filter(Boolean);
      const data = msg.data;
      let touched;
      if (isPatch && data && typeof data === 'object'){
        for (const k of Object.keys(data)) setPath(st, [...segs, k], data[k]);
        touched = segs.length ? [segs[0]] : Object.keys(data);
      } else {
        setPath(st, segs, data);
        touched = segs.length ? [segs[0]] : Object.keys(st.tree);
      }
      for (const sub of st.subs) if (touched.includes(sub.tf)) this.emit(sub, st.tree[sub.tf]);
    };
    es.addEventListener('put',   e=>handle(e,false));
    es.addEventListener('patch', e=>handle(e,true));
    es.addEventListener('cancel', ()=>showGlobalMsg('リアルタイム更新が拒否されました（データベースのルールを確認）'));
    es.onerror = ()=>{ st.hadError = true; setConn(false); };
    es.onopen  = ()=>{ setConn(true); if (st.hadError){ st.hadError = false; for (const s of st.subs) s.onReconnect(); } };
  },
  closeAll(){ for (const k of Object.keys(this.streams)){ const st = this.streams[k]; if (st.es) st.es.close(); } this.streams = {}; },
};
function setPath(st, segs, val){
  if (!segs.length){ st.tree = (val && typeof val === 'object') ? val : {}; return; }
  let o = st.tree;
  for (let i = 0; i < segs.length - 1; i++){
    if (!o[segs[i]] || typeof o[segs[i]] !== 'object') o[segs[i]] = {};
    o = o[segs[i]];
  }
  const last = segs[segs.length-1];
  if (val === null) delete o[last]; else o[last] = val;
}

/* ---------- データの取得元：デモ（ランダムな値動き） ----------
 * 1分足を1本の系列として作り、各時間足はそこから集計（MT5と同じく時間足どうしの値が一致する） */
const Demo = {
  syms:[
    {key:'USDJPY', name:'USDJPY', digits:3, base:154.20, vol:0.012},
    {key:'EURUSD', name:'EURUSD', digits:5, base:1.0845, vol:0.00008},
    {key:'GBPJPY', name:'GBPJPY', digits:3, base:196.50, vol:0.018},
    {key:'GOLD',   name:'GOLD',   digits:2, base:2650.0, vol:0.55},
  ],
  DAYS:120, offset:7200, base:{}, timers:new Set(),
  rng(seed){ return ()=>{ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed);
    t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; },
  nowMin(){ return Math.floor((Date.now()/1000 + this.offset)/60)*60; },
  round(v, d){ const k = Math.pow(10, d); return Math.round(v*k)/k; },
  ensure(key){
    const s = this.syms.find(x=>x.key===key), now = this.nowMin();
    let B = this.base[key];
    if (!B){
      const n = this.DAYS*1440, r = this.rng([...key].reduce((a,c)=>a*31+c.charCodeAt(0),7));
      B = this.base[key] = {t0: now - (n-1)*60, o:[], h:[], l:[], c:[], r, s};
      let p = s.base, drift = 0;
      for (let i = 0; i < n; i++){
        if (i % 600 === 0) drift = (r()-0.5)*s.vol*0.35;
        const o = p, c = o + drift + (r()-0.5)*s.vol*2;
        B.o.push(o); B.c.push(c); B.h.push(Math.max(o,c) + r()*s.vol*0.6); B.l.push(Math.min(o,c) - r()*s.vol*0.6); p = c;
      }
      const adj = s.base - B.c[n-1];
      for (let i = 0; i < n; i++){
        B.o[i] = this.round(B.o[i]+adj, s.digits); B.h[i] = this.round(B.h[i]+adj, s.digits);
        B.l[i] = this.round(B.l[i]+adj, s.digits); B.c[i] = this.round(B.c[i]+adj, s.digits);
      }
    }
    while (B.t0 + (B.c.length-1)*60 < now){ const c = B.c[B.c.length-1]; B.o.push(c); B.h.push(c); B.l.push(c); B.c.push(c); }
    return B;
  },
  aggregate(key, tf, n){
    const B = this.ensure(key), sec = TF_SEC[tf], out = [];
    let cur = null;
    for (let i = B.c.length-1; i >= 0; i--){
      const t = B.t0 + i*60, bt = Math.floor(t/sec)*sec;
      if (!cur || cur.t !== bt){
        if (cur){ out.push(cur); if (out.length >= n){ cur = null; break; } }
        cur = {t:bt, o:B.o[i], h:B.h[i], l:B.l[i], c:B.c[i], v:1};
      } else { cur.o = B.o[i]; cur.h = Math.max(cur.h, B.h[i]); cur.l = Math.min(cur.l, B.l[i]); cur.v++; }
    }
    if (cur && out.length < n) out.push(cur);
    return out.reverse();
  },
  async symbols(){ return this.syms; },
  async status(){ return {updated: Math.floor(Date.now()/1000), serverOffset: this.offset}; },
  async history(key, tf, n){ return this.aggregate(key, tf, n); },
  subscribe(key, tf, onBar){
    const s = this.syms.find(x=>x.key===key);
    const id = setInterval(()=>{
      const B = this.ensure(key), L = B.c.length-1;
      const c = this.round(B.c[L] + (B.r()-0.5)*s.vol*0.8, s.digits);
      B.c[L] = c; B.h[L] = Math.max(B.h[L], c); B.l[L] = Math.min(B.l[L], c);
      const bar = this.aggregate(key, tf, 1)[0];
      const sp = Math.round((s.digits === 3 || s.digits === 5 ? 12 : 25) + B.r()*6);
      onBar(bar, {b:c, a:this.round(c + sp*Math.pow(10,-s.digits), s.digits), sp});
    }, 700);
    this.timers.add(id);
    return ()=>{ clearInterval(id); this.timers.delete(id); };
  },
  closeAll(){ for (const id of this.timers) clearInterval(id); this.timers.clear(); },
};

/* ---------- 共通の部品 ---------- */
const LC = LightweightCharts;
const CHART_OPTS = {
  autoSize:true,
  layout:{ background:{type:'solid', color:'#0f1115'}, textColor:'#aab2c0', fontSize:11,
    panes:{ separatorColor:'#262b36', separatorHoverColor:'rgba(59,130,246,.25)', enableResize:true } },
  grid:{ vertLines:{color:'#1a1e27'}, horzLines:{color:'#1a1e27'} },
  rightPriceScale:{ borderColor:'#262b36', scaleMargins:{top:0.08, bottom:0.06} },
  timeScale:{ borderColor:'#262b36', timeVisible:true, secondsVisible:false, rightOffset:12 },
  crosshair:{ mode: LC.CrosshairMode.Normal },
  localization:{ locale:'ja-JP', dateFormat:'yyyy/MM/dd' },
};
const CANDLE_OPTS = { upColor:'#26a69a', downColor:'#ef5350', borderVisible:false, wickUpColor:'#26a69a', wickDownColor:'#ef5350' };
function priceFormat(prec){ return {type:'price', precision:prec, minMove:Math.pow(10,-prec)}; }
function fmt(v, p){ return v == null || !isFinite(v) ? '-' : (+v).toFixed(p); }
// FX（小数3桁・5桁）はpips、それ以外（GOLD・指数など）はポイントで表示
function fmtSpread(sp, digits){
  if (sp == null || !isFinite(sp)) return '-';
  return digits === 3 || digits === 5 ? (sp/10).toFixed(1) + ' pips' : sp + ' pt';
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* =====================================================================
 *  チャート1画面分
 * ===================================================================== */
class Panel {
  constructor(i){
    this.i = i; this.cfg = G.paneCfg[i];
    const el = document.createElement('section'); el.className = 'panel';
    el.innerHTML = `<div class="phead"><select class="psym" aria-label="銘柄"></select><div class="ptfs"></div><select class="ptfsel" aria-label="時間足"></select>` +
      `<button class="pmax" title="この画面だけを大きく表示">⤢</button></div>` +
      `<div class="pbody"><div class="pchart"></div><div class="legend"></div><div class="msg hidden"></div></div>`;
    $('grid').appendChild(el); this.el = el;
    this.selSym = el.querySelector('.psym'); this.tfBox = el.querySelector('.ptfs'); this.tfSel = el.querySelector('.ptfsel');
    this.tfSel.innerHTML = TIMEFRAMES.map(t=>`<option value="${t}">${t}</option>`).join('');
    this.tfSel.onchange = ()=>this.setTf(this.tfSel.value);
    this.legendEl = el.querySelector('.legend'); this.msgEl = el.querySelector('.msg');
    this.chart = LC.createChart(el.querySelector('.pchart'), CHART_OPTS);
    this.candle = this.chart.addSeries(LC.CandlestickSeries, CANDLE_OPTS);
    this.markerApi = LC.createSeriesMarkers(this.candle, []);
    this.indSeries = {}; this.indLines = []; this.markersKey = ''; this.paneCount = 1;
    this.bars = []; this.sym = null; this.digits = 3; this.quote = null; this.askLine = null;
    this.unsub = null; this.loadSeq = 0; this.rafPending = false; this.rafFull = false; this.fresh = false;
    this.gk = new GKPanel(this);
    // 右下の表をタップ・クリックすると詳細を開く
    this.chart.subscribeClick(pt=>{ if (pt && pt.point && (pt.paneIndex ?? 0) === 0 && this.gk.hit(pt.point)) gkOpenDetail(this); });
    this.chart.subscribeCrosshairMove(p=>this.updateLegend(p && p.logical != null && p.time != null ? Math.round(p.logical) : null));
    this.selSym.onchange = ()=>onPanelSymbol(this, this.selSym.value);
    el.querySelector('.pmax').onclick = ()=>toggleMax(this.i);
    this.buildTf(); this.fillSymbols();
  }
  get tf(){ return this.cfg.tf; }

  setTf(tf){ if (tf === this.tf) return; this.cfg.tf = tf; savePaneCfg(); this.buildTf(); this.load(); }
  buildTf(){
    this.tfBox.innerHTML = '';
    for (const tf of TIMEFRAMES){
      const b = document.createElement('button'); b.textContent = tf; b.className = tf === this.tf ? 'on' : '';
      b.onclick = ()=>this.setTf(tf);
      this.tfBox.appendChild(b);
    }
    this.tfSel.value = this.tf;
  }
  // 銘柄リストを入れ直す。表示中の銘柄が変わったら true
  fillSymbols(){
    const before = this.sym && this.sym.key;
    this.selSym.innerHTML = G.symbols.map(s=>`<option value="${esc(s.key)}">${esc(s.name)}</option>`).join('');
    this.sym = G.symbols.find(s=>s.key === this.cfg.sym) || G.symbols[0] || null;
    this.cfg.sym = this.sym ? this.sym.key : null;
    if (this.sym){ this.selSym.value = this.sym.key; this.digits = this.sym.digits; }
    return (this.sym && this.sym.key) !== before;
  }

  disp(t){ return G.tz === 'jst' && TF_SEC[this.tf] < 86400 ? t - G.serverOffset + JST : t; }
  toCandle(b){ return {time:this.disp(b.t), open:b.o, high:b.h, low:b.l, close:b.c}; }
  showMsg(t){ if (!t){ this.msgEl.classList.add('hidden'); return; } this.msgEl.innerHTML = t; this.msgEl.classList.remove('hidden'); }

  async load(){
    const seq = ++this.loadSeq;
    if (this.unsub){ this.unsub(); this.unsub = null; }
    this.setQuote(null);
    if (!this.sym){ this.bars = []; this.render(true); return; }
    this.showMsg('読み込み中…');
    const key = this.sym.key, tf = this.tf;
    let bars;
    try{ bars = await G.src.history(key, tf, MAX_BARS); }
    catch(e){ if (seq === this.loadSeq) this.showMsg('データを読み込めませんでした<br><span class="note">' + esc(e.message) + '</span>'); return; }
    if (seq !== this.loadSeq) return;
    this.bars = bars;
    this.showMsg(bars.length ? '' : 'この時間足のデータがまだありません<br><span class="note">EAが履歴を送り終えるまでお待ちください</span>');
    this.digits = this.sym.digits;
    this.candle.applyOptions({priceFormat: priceFormat(this.digits)});
    this.clearIndicators();
    this.gk.reset();
    this.fresh = true; this.render(true); this.fresh = false;
    if (bars.length) this.chart.timeScale().setVisibleLogicalRange({from: Math.max(0, bars.length - 120), to: bars.length + 14});
    this.unsub = G.src.subscribe(key, tf, (b,q)=>{ if (seq === this.loadSeq) this.onLive(b,q); }, ()=>this.reloadRecent(50));
  }

  onLive(b, q){
    if (q) this.setQuote(q);
    const bars = this.bars;
    if (!bars.length){ bars.push(b); this.schedule(true); return; }
    const last = bars[bars.length-1];
    if (b.t === last.t){ bars[bars.length-1] = b; this.schedule(false); }
    else if (b.t > last.t){
      bars.push(b); this.schedule(false);
      this.gk.onNewBar(b.t);
      if (!G.demo) this.reloadRecent(3);   // 確定した直前の足を最終値に揃える
    }
  }

  // 直近n本を取り直して差し替える（新しい足ができた時・再接続時）
  async reloadRecent(n){
    if (!this.sym) return;
    const key = this.sym.key, tf = this.tf, seq = this.loadSeq;
    try{
      const recent = await G.src.history(key, tf, n);
      if (seq !== this.loadSeq || !recent.length || !this.bars.length) return;
      const map = new Map(this.bars.map((b,i)=>[b.t,i]));
      for (const b of recent){
        if (map.has(b.t)) this.bars[map.get(b.t)] = b;
        else if (b.t > this.bars[this.bars.length-1].t) this.bars.push(b);
      }
      this.bars.sort((a,b)=>a.t-b.t);
      this.schedule(true);
    }catch(e){}
  }

  schedule(full){
    this.rafFull = this.rafFull || full;
    if (this.rafPending) return; this.rafPending = true;
    requestAnimationFrame(()=>{ this.rafPending = false; const f = this.rafFull; this.rafFull = false; this.render(f); });
  }

  render(full){
    const bars = this.bars;
    if (!bars.length){
      this.candle.setData([]); this.markerApi.setMarkers([]); this.markersKey = ''; this.indLines = [];
      this.clearIndicators(); this.updateLegend(null); this.gk.refresh(); return;
    }
    if (full){
      const range = this.chart.timeScale().getVisibleLogicalRange();
      this.candle.setData(bars.map(b=>this.toCandle(b)));
      if (range && !this.fresh) this.chart.timeScale().setVisibleLogicalRange(range);
    } else {
      this.candle.update(this.toCandle(bars[bars.length-1]));
    }
    this.renderIndicators(full);
    this.updateLegend(null);
    this.gk.refresh();
  }

  clearIndicators(){
    for (const k of Object.keys(this.indSeries)){ this.chart.removeSeries(this.indSeries[k]); delete this.indSeries[k]; }
  }

  renderIndicators(full){
    const bars = this.bars, n = bars.length, used = new Set(), markers = [];
    this.indLines = [];
    for (const ind of INDICATORS){
      const st = indState[ind.id]; if (!st.on || ind.custom) continue;
      let res; try{ res = ind.compute(bars, st.p, TA) || {}; }catch(e){ console.error(ind.name, e); continue; }
      for (const ln of res.lines || []){
        const k = ind.id + ':' + ln.key; used.add(k);
        let s = this.indSeries[k], created = false;
        if (!s){
          // 下段の指標は、指標ごとに専用の段（ペイン）を作る
          let pane = 0, firstInPane = false;
          if (ind.pane === 'sub'){
            const sib = Object.keys(this.indSeries).find(x=>x.startsWith(ind.id + ':'));
            if (sib) pane = this.indSeries[sib].getPane().paneIndex();
            else { pane = this.chart.panes().length; firstInPane = true; }
          }
          s = this.chart.addSeries(LC.LineSeries, {
            color:ln.color, lineWidth:ln.width || 2, lineStyle:ln.style || 0,
            priceFormat: priceFormat(ln.precision ?? this.digits),
            lastValueVisible: ind.pane === 'sub', priceLineVisible:false, crosshairMarkerVisible:false,
          }, pane);
          if (firstInPane)
            for (const lv of ind.levels || []) s.createPriceLine({price:lv, color:'#4a5160', lineWidth:1, lineStyle:2, axisLabelVisible:false});
          this.indSeries[k] = s; created = true;
        }
        const vals = ln.values;
        if (full || created || ind.repaint){
          const data = [];
          for (let i = 0; i < n; i++){
            const t = this.disp(bars[i].t);
            data.push(vals[i] == null || !isFinite(vals[i]) ? {time:t} : {time:t, value:vals[i]});
          }
          s.setData(data);
        } else if (vals[n-1] != null && isFinite(vals[n-1])){
          s.update({time:this.disp(bars[n-1].t), value:vals[n-1]});
        }
        this.indLines.push({name:ln.name, color:ln.color, values:vals, prec:ln.precision ?? this.digits});
      }
      for (const m of res.markers || []){
        if (m.index < 0 || m.index >= n) continue;
        markers.push({time:this.disp(bars[m.index].t), position:m.position || 'aboveBar', shape:m.shape || 'circle', color:m.color || '#fff', text:m.text || ''});
      }
    }
    for (const k of Object.keys(this.indSeries)) if (!used.has(k)){ this.chart.removeSeries(this.indSeries[k]); delete this.indSeries[k]; }
    markers.sort((a,b)=>a.time-b.time);
    const mk = JSON.stringify(markers);
    if (full || mk !== this.markersKey){ this.markerApi.setMarkers(markers); this.markersKey = mk; }
    // 段の高さ：ローソク足を大きく、下段は小さく
    const panes = this.chart.panes();
    if (panes.length !== this.paneCount){
      this.paneCount = panes.length;
      panes.forEach((p,i)=>p.setStretchFactor(i === 0 ? 3 : 1));
    }
  }

  setQuote(q){
    this.quote = q;
    if (!q){
      if (this.askLine){ this.candle.removePriceLine(this.askLine); this.askLine = null; }
      return;
    }
    if (!this.askLine)
      this.askLine = this.candle.createPriceLine({price:q.a, color:'#8a93a3', lineWidth:1, lineStyle:2, axisLabelVisible:true, title:'Ask'});
    else this.askLine.applyOptions({price:q.a});
    if (!this.rafPending) this.updateLegend(null);
  }

  updateLegend(idx){
    const bars = this.bars;
    if (!bars.length || !this.sym){ this.legendEl.innerHTML = ''; return; }
    if (idx == null || idx < 0 || idx >= bars.length) idx = bars.length - 1;
    const b = bars[idx], d = this.digits, cls = b.c >= b.o ? 'up' : 'down';
    let html = `<div><span class="sym">${esc(this.sym.name)}</span> · ${this.tf}</div>` +
      `<div class="ohlc ${cls}">始 ${fmt(b.o,d)}　高 ${fmt(b.h,d)}　安 ${fmt(b.l,d)}　終 ${fmt(b.c,d)}</div>`;
    const q = this.quote;
    if (q) html += `<div class="quote"><span class="qba">Bid ${fmt(q.b,d)}　Ask ${fmt(q.a,d)}　</span>スプレッド <b>${fmtSpread(q.sp, d)}</b></div>`;
    if (this.indLines.length)
      html += '<div class="ind">' + this.indLines.map(l=>`<span style="color:${l.color}">${esc(l.name)} ${fmt(l.values[idx], l.prec)}</span>`).join('') + '</div>';
    this.legendEl.innerHTML = html;
  }

  destroy(){
    if (gkDetailPanel === this) gkCloseDetail();
    this.loadSeq++;
    if (this.unsub){ this.unsub(); this.unsub = null; }
    this.chart.remove(); this.el.remove();
  }
}

/* =====================================================================
 *  画面全体
 * ===================================================================== */
let panels = [];

function buildLayout(){
  const n = Math.min(MAX_PANELS, Math.max(1, G.layout));
  while (panels.length > n) panels.pop().destroy();
  if (G.maxIdx >= n) G.maxIdx = -1;
  while (panels.length < n){ const p = new Panel(panels.length); panels.push(p); if (G.src) p.load(); }
  $('grid').className = 'n' + n;
  paintMax(); paintLayout();
}
function paintLayout(){
  for (const b of $('layout').querySelectorAll('button')) b.className = +b.dataset.n === G.layout ? 'on' : '';
  $('link').className = G.link ? 'on' : '';
}
(function initLayoutButtons(){
  for (let n = 1; n <= MAX_PANELS; n++){
    const b = document.createElement('button'); b.textContent = n; b.dataset.n = n;
    b.onclick = ()=>{ G.layout = n; store.set('layout', n); G.maxIdx = -1; buildLayout(); };
    $('layout').appendChild(b);
  }
})();

function toggleMax(i){ G.maxIdx = G.maxIdx === i ? -1 : i; paintMax(); }
function paintMax(){
  $('grid').classList.toggle('max', G.maxIdx >= 0);
  panels.forEach((p,i)=>{
    p.el.classList.toggle('isMax', i === G.maxIdx);
    p.el.querySelector('.pmax').textContent = i === G.maxIdx ? '⤡' : '⤢';
    p.el.querySelector('.pmax').title = i === G.maxIdx ? '元の並びに戻す' : 'この画面だけを大きく表示';
  });
}

// 銘柄の切り替え（連動がオンなら全画面）
function onPanelSymbol(panel, key){
  const targets = G.link ? panels : [panel];
  if (G.link) for (const c of G.paneCfg) c.sym = key; else panel.cfg.sym = key;
  savePaneCfg();
  for (const p of targets) if (p.fillSymbols()) p.load();
  for (const p of panels) if (!targets.includes(p)) p.fillSymbols();
}
$('link').onclick = ()=>{
  G.link = !G.link; store.set('link', G.link); paintLayout();
  if (G.link && panels[0] && panels[0].sym) onPanelSymbol(panels[0], panels[0].sym.key);
};

/* ---------- 状態表示 ---------- */
function showGlobalMsg(t){ const m = $('gmsg'); if (!t){ m.classList.add('hidden'); return; } m.innerHTML = t; m.classList.remove('hidden'); }
function setConn(ok){ G.conn = ok; paintStatus(); }
function paintStatus(){
  let color = '#26a69a', text = '';
  if (G.demo){ color = '#8a93a3'; text = 'デモ表示中'; }
  else if (!G.conn){ color = '#ef5350'; text = '接続が切れています（再接続中）'; }
  else if (!G.lastBeat){ color = '#8a93a3'; text = 'EAからのデータ待ち'; }
  else {
    const age = Math.max(0, Math.floor(Date.now()/1000) - G.lastBeat);
    if (age < 60) text = 'EA稼働中';
    else { color = '#f5b041'; text = `EAの更新が ${age < 3600 ? Math.floor(age/60)+'分' : Math.floor(age/3600)+'時間'}止まっています`; }
  }
  $('dot').style.background = color; $('statusText').textContent = text;
}
async function refreshStatus(){
  try{
    const s = await G.src.status();
    if (s.updated) G.lastBeat = +s.updated;
    if (s.serverOffset != null && +s.serverOffset !== G.serverOffset){
      G.serverOffset = +s.serverOffset; if (G.tz === 'jst') panels.forEach(p=>p.schedule(true));
    }
    // MT5の気配値表示が変わったら銘柄リストを読み直す
    if (s.symbolsRev != null && +s.symbolsRev !== G.symbolsRev){
      const first = G.symbolsRev == null; G.symbolsRev = +s.symbolsRev;
      if (!first) reloadSymbols();
    }
    if (!G.demo) setConn(true);
  }catch(e){ if (!G.demo) setConn(false); }
  paintStatus();
}
async function reloadSymbols(){
  let syms; try{ syms = await G.src.symbols(); }catch(e){ return; }
  G.symbols = syms;
  for (const p of panels) if (p.fillSymbols()) p.load();
  savePaneCfg();
  showGlobalMsg(syms.length ? '' : '銘柄がありません<br><span class="note">MT5の気配値表示に銘柄を表示してください</span>');
}

$('tz').onclick = ()=>{ G.tz = G.tz === 'jst' ? 'server' : 'jst'; store.set('tz', G.tz); paintTz(); panels.forEach(p=>p.schedule(true)); };

function saveInd(){ store.set('ind', indState); }
function refreshIndicators(){ panels.forEach(p=>{ p.clearIndicators(); p.gk.reset(); p.schedule(true); }); paintGkBtn(); }
function paintGkBtn(){ $('gkBtn').className = indState.gk && indState.gk.on ? 'on' : ''; }
$('gkBtn').onclick = ()=>{ indState.gk.on = !indState.gk.on; saveInd(); refreshIndicators(); };
function buildIndList(){
  const box = $('indList'); box.innerHTML = '';
  for (const ind of INDICATORS){
    const st = indState[ind.id], item = document.createElement('div'); item.className = 'ind-item';
    const head = document.createElement('label'); head.className = 'head';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = st.on;
    cb.onchange = ()=>{ st.on = cb.checked; saveInd(); refreshIndicators(); };
    head.append(cb, document.createTextNode(ind.name + (ind.pane === 'sub' ? '（下段）' : '')));
    item.appendChild(head);
    if (ind.custom === 'gk'){ gkBuildSettings(item, refreshIndicators); box.appendChild(item); continue; }
    if (ind.params.length){
      const ps = document.createElement('div'); ps.className = 'params';
      for (const pr of ind.params){
        const lab = document.createElement('label'); lab.textContent = pr.label;
        let inp;
        if (pr.options){ inp = document.createElement('select'); for (const o of pr.options){ const op = document.createElement('option'); op.value = op.textContent = o; inp.appendChild(op); } }
        else { inp = document.createElement('input'); inp.type = 'number'; inp.step = 'any'; inp.inputMode = 'decimal'; }
        inp.value = st.p[pr.key];
        inp.onchange = ()=>{
          const v = pr.options ? inp.value : parseFloat(inp.value);
          if (!pr.options && !(v > 0)){ inp.value = st.p[pr.key]; return; }
          st.p[pr.key] = v; saveInd(); refreshIndicators();
        };
        lab.appendChild(inp); ps.appendChild(lab);
      }
      item.appendChild(ps);
    }
    box.appendChild(item);
  }
}

  store.set('db', v); $('cfgModal').classList.add('hidden'); start(v || DEFAULT_DB_URL || 'demo');
};

/* ---------- 起動 ---------- */
async function start(db){
  if (G.src) G.src.closeAll();
  if (G.statusTimer){ clearInterval(G.statusTimer); G.statusTimer = null; }
  while (panels.length) panels.pop().destroy();
  G.db = db; G.demo = !db || db === 'demo'; G.src = null;
  G.lastBeat = 0; G.symbolsRev = null; G.conn = true; G.symbols = [];
  paintStatus(); showGlobalMsg('接続中…');
  const src = G.demo ? Demo : Firebase;
  let syms;
  try{ G.db = db; syms = await src.symbols(); }
  catch(e){ setConn(false); showGlobalMsg('データベースに接続できませんでした<br><span class="note">' + esc(e.message) + '<br>⚙ からURLを確認してください</span>'); return; }
  G.src = src; G.symbols = syms;
  showGlobalMsg(syms.length ? '' : 'まだデータがありません<br><span class="note">VPSでEAが動いているか確認してください</span>');
  if (G.link){ const k = G.paneCfg[0].sym; for (const c of G.paneCfg) c.sym = k; }
  await refreshStatus();
  G.statusTimer = setInterval(refreshStatus, 15000);
  buildLayout();
  savePaneCfg();
}
setInterval(paintStatus, 5000);
// スマホでアプリを切り替えて戻ったときは取り直す
document.addEventListener('visibilitychange', ()=>{
  if (document.visibilityState === 'visible' && G.src && !G.demo){ refreshStatus(); panels.forEach(p=>p.load()); }
});

paintTz(); paintLayout(); paintGkBtn();
start(store.get('db', '') || DEFAULT_DB_URL || 'demo');
</script>
